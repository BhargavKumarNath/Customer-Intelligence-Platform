name: CD

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  build-and-push-ghcr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/customer-intelligence-platform-api
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-render:
    runs-on: ubuntu-latest
    needs: build-and-push-ghcr
    # Skipped until the one-time Render setup is done - see docs/DEPLOYMENT.md.
    # Render auto-builds straight from this repo's Dockerfile once connected; this
    # step just calls its Deploy Hook so the deploy only fires after CI/build succeed,
    # instead of on every raw push regardless of test status.
    if: ${{ vars.RENDER_DEPLOY_HOOK_URL != '' }}
    steps:
      - name: Trigger Render deploy
        run: curl -fsS -X POST "${{ vars.RENDER_DEPLOY_HOOK_URL }}"
