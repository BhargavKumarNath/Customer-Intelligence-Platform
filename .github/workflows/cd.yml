name: CD

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  build-and-push-ghcr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/customer-intelligence-platform-api
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-huggingface:
    runs-on: ubuntu-latest
    needs: build-and-push-ghcr
    # Skipped until the one-time HF Space setup is done - see docs/DEPLOYMENT.md.
    if: ${{ vars.HF_USERNAME != '' && vars.HF_SPACE_NAME != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage a minimal Hugging Face Space deploy tree
        run: |
          set -eu
          rm -rf /tmp/hf-space
          mkdir -p /tmp/hf-space/scripts /tmp/hf-space/data/sample
          cp Dockerfile pyproject.toml /tmp/hf-space/
          cp -r api /tmp/hf-space/api
          cp -r src /tmp/hf-space/src
          cp scripts/create_cloud_database.py /tmp/hf-space/scripts/
          cp data/sample/sample_optimized.parquet /tmp/hf-space/data/sample/
          cat > /tmp/hf-space/README.md <<EOF
          ---
          title: Customer Intelligence Platform API
          emoji: 📊
          colorFrom: blue
          colorTo: indigo
          sdk: docker
          app_port: 8000
          pinned: false
          ---

          Typed FastAPI service over precomputed RFM segments, LightGBM
          propensity scores, market-basket recommendations, and an A/B test
          simulator. Source: https://github.com/${{ github.repository }}
          EOF

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ vars.HF_USERNAME }}
          HF_SPACE_NAME: ${{ vars.HF_SPACE_NAME }}
        working-directory: /tmp/hf-space
        run: |
          set -eu
          git init -q
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git checkout -q -b main
          git add -A
          git commit -q -m "Deploy from ${{ github.repository }}@${{ github.sha }}"
          git remote add space "https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/${HF_SPACE_NAME}"
          git push --force space main
