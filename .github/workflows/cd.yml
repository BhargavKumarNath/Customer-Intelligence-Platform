name: CD

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  build-and-push-ghcr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/customer-intelligence-platform-api
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

# NOTE: this workflow only builds and publishes the image to GHCR. It does not
# deploy anywhere. The former `deploy-render` job was removed in Phase 1 (task 7):
# Render is not the target platform. Per DEPLOYMENT_ARCHITECTURE_REVIEW.md (Stack E)
# the API is an OPTIONAL, off-the-user-path service; if it is ever deployed it goes
# to Cloud Run via Workload Identity Federation, added in deployment_stages.md
# Phase 7 (skippable). No `RENDER_DEPLOY_HOOK_URL` variable/secret is used.
