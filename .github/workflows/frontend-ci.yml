name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "scripts/build_static_artifacts.py"
      - "src/**"
      - "schemas/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - "scripts/build_static_artifacts.py"
      - "src/**"
      - "schemas/**"
      - ".github/workflows/frontend-ci.yml"

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  # ---------------------------------------------------------------------------
  # Build the pinned Phase 2 data set. Same script and same --git-sha as
  # .github/workflows/precompute.yml, which is byte-deterministic (proven by
  # tests/precompute), so this rebuild and the published set are identical.
  # ---------------------------------------------------------------------------
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"
          cache: "pip"
          cache-dependency-path: requirements.lock
      - name: Install (locked, hash-checked)
        working-directory: .
        run: |
          pip install --require-hashes -r requirements.lock
          pip install -e . --no-deps
      - name: Build static artifacts
        working-directory: .
        run: python scripts/build_static_artifacts.py --out dist/data --git-sha "${GITHUB_SHA}"
      - uses: actions/upload-artifact@v7
        with:
          name: static-data-${{ github.sha }}
          path: dist/data/${{ github.sha }}/
          retention-days: 3

  # ---------------------------------------------------------------------------
  # Lint, typecheck, unit tests, static export, static-output assertions,
  # Playwright smoke. Publishes out/ for the deploy and Lighthouse jobs so they
  # ship exactly what was tested.
  # ---------------------------------------------------------------------------
  check:
    runs-on: ubuntu-latest
    needs: data
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"
      - name: Install python (for the A/B fixture drift guard)
        working-directory: .
        run: |
          pip install --require-hashes -r requirements.lock
          pip install -e . --no-deps
      - run: pnpm install --frozen-lockfile
      - name: A/B fixture is up to date
        run: |
          python scripts/gen_ab_fixture.py
          git diff --exit-code -- src/lib/__fixtures__/ab_cases.json
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - uses: actions/download-artifact@v7
        with:
          name: static-data-${{ github.sha }}
          path: dist/data/${{ github.sha }}/
      - name: Build (static export)
        run: DATA_SHA="${GITHUB_SHA}" pnpm build
      - name: Assert the export is fully static
        run: |
          test ! -d out/_next/server
          test -f out/_headers
          test -f out/data/current/meta.json
      - name: Assert the build consumed this commit's data set
        run: |
          cat public/data/current/manifest.json
          node -e "const m=require('./public/data/current/manifest.json'); if (m.sha!==process.env.GITHUB_SHA) { console.error('data pin',m.sha,'!= commit',process.env.GITHUB_SHA); process.exit(1) } console.log('data pin',m.sha,'(source',m.pinSource + ')')"
      - name: Playwright smoke
        run: |
          pnpm exec playwright install --with-deps chromium
          E2E_DUCKDB=1 pnpm exec playwright test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-out-${{ github.sha }}
          path: frontend/out/
          retention-days: 3

  lighthouse:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v7
        with:
          name: frontend-out-${{ github.sha }}
          path: frontend/out/
      - name: Lighthouse CI (serves ./out, no rebuild)
        run: pnpm dlx @lhci/cli@0.14.x autorun

  # ---------------------------------------------------------------------------
  # Deploy to Cloudflare Pages. Dormant until the owner sets the
  # `CLOUDFLARE_PAGES_PROJECT` repo variable and adds CLOUDFLARE_API_TOKEN +
  # CLOUDFLARE_ACCOUNT_ID secrets. If the owner instead connects the repo via
  # the Pages Git integration, leave the variable unset and these stay skipped.
  # ---------------------------------------------------------------------------
  deploy-preview:
    runs-on: ubuntu-latest
    needs: check
    # Same-repo PRs only: fork PRs cannot read the Cloudflare secrets.
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && vars.CLOUDFLARE_PAGES_PROJECT != ''
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: frontend-out-${{ github.sha }}
          path: out/
      - name: Publish preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          PR_BRANCH: ${{ github.head_ref }}
        working-directory: .
        run: |
          set -euo pipefail
          pnpm dlx wrangler@3 pages deploy out \
            --project-name="$CF_PROJECT" \
            --branch="$PR_BRANCH" \
            --commit-hash="$GITHUB_SHA" | tee deploy.log
          URL=$(grep -oE 'https://[a-z0-9.-]+\.pages\.dev' deploy.log | head -1 || true)
          echo "Preview: ${URL:-see log}" >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_PAGES_PROJECT != ''
    permissions:
      contents: read
      deployments: write
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: frontend-out-${{ github.sha }}
          path: out/
      - name: Publish production
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        working-directory: .
        run: |
          set -euo pipefail
          pnpm dlx wrangler@3 pages deploy out \
            --project-name="$CF_PROJECT" \
            --branch=main \
            --commit-hash="$GITHUB_SHA" | tee deploy.log
          URL=$(grep -oE 'https://[a-z0-9.-]+\.pages\.dev' deploy.log | head -1 || true)
          echo "url=${URL:-}" >> "$GITHUB_OUTPUT"
          echo "Production: ${URL:-see log}" >> "$GITHUB_STEP_SUMMARY"

  # Post-deploy smoke against the live production URL. Uses the PROD_URL repo
  # variable (the custom domain or the *.pages.dev URL).
  smoke:
    runs-on: ubuntu-latest
    needs: deploy-production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PROD_URL != ''
    steps:
      - name: Routes and data are live
        env:
          PROD_URL: ${{ vars.PROD_URL }}
        working-directory: .
        run: |
          set -euo pipefail
          BASE="${PROD_URL%/}"
          for path in / /executive/ /ml-engine/ /user-intelligence/; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "$BASE$path")
            echo "$path -> $code"
            [ "$code" = "200" ]
          done
          META=$(curl -fsS "$BASE/data/current/meta.json")
          echo "$META" | jq -e '.git_sha and (.git_sha | length > 0)' >/dev/null
          echo "live data git_sha: $(echo "$META" | jq -r '.git_sha')  range: $(echo "$META" | jq -r '.date_range | join("..")')"
          HDR=$(curl -sSI "$BASE/" | tr -d '\r')
          echo "$HDR" | grep -iq '^content-security-policy:' && echo "CSP present"
          echo "$HDR" | grep -iq '^strict-transport-security:' && echo "HSTS present"
