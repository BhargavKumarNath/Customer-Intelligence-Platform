name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[api,dev]"

      - name: Ruff lint
        run: >
          ruff check
          src/config.py src/db.py src/domain src/services src/analysis/ab_testing.py
          src/processing/dimensional_model.py
          api tests

      - name: Ruff format check
        run: >
          ruff format --check
          src/config.py src/db.py src/domain src/services src/analysis/ab_testing.py
          src/processing/dimensional_model.py
          api tests

      - name: mypy
        run: >
          mypy
          src/config.py src/db.py src/domain src/services src/analysis/ab_testing.py
          src/processing/dimensional_model.py
          api

      - name: Rebuild sample.duckdb from the tracked parquet
        run: python scripts/create_cloud_database.py

      - name: pytest
        run: pytest -q

      - name: Generate data-drift report
        run: python scripts/generate_drift_report.py

      - name: Upload drift report artifact
        uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: outputs/drift_report.html
          retention-days: 30

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (validation only, not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: cip-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
