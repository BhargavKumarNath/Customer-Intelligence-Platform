version: 2
updates:
  # Python deps declared in pyproject.toml + requirements.txt. The hash-pinned
  # requirements.lock is regenerated manually with `uv pip compile` after a bump.
  #
  # Major bumps are ignored for now: the project is mid-migration, several deps
  # are pinned below a known ceiling on purpose (pandas <3, plotly <6, polars <2,
  # scikit-learn <2), and plotly/streamlit go away entirely in Phase 9. Security
  # fixes still come through as minor/patch PRs. Revisit these ignores per-phase.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # GitHub Actions referenced by .github/workflows/*. Keeps `uses:` current and
  # is the safety net that would have surfaced the DuckDB/mypy break as a PR.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions-all:
        patterns: ["*"]

  # Frontend (Next.js) npm deps under frontend/. Same posture as the pip block:
  # the project is mid-migration and several majors are pinned on purpose
  # (next 15 / react 19 / recharts 2 / framer-motion 11 / nuqs 2), so majors are
  # held back and only minor/patch (security included) come through, grouped.
  # pnpm-lock.yaml is the source of truth; Dependabot updates it in place.
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Dockerfile base image. pyproject requires-python is ">=3.11,<3.14", so only
  # patch bumps of the 3.11 line are wanted here (e.g. a new slim rebuild);
  # 3.12/3.13/3.14 bumps would break the build until the Dockerfile + pyproject
  # are updated deliberately (Phase 1 task 4).
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "python"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
