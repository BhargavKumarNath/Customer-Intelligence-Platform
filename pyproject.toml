[project]
name = "customer-intelligence-platform"
version = "0.1.0"
description = "Customer intelligence analytics/ML core and FastAPI service"
requires-python = ">=3.11,<3.14"
readme = "readme.md"
license = { text = "MIT" }

# Core runtime deps for the API/service layer only (src/db.py, src/services/*,
# src/analysis/ab_testing.py). Kept lean on purpose: pyarrow, polars, and
# scikit-learn are NOT imported by anything the API touches (the checked-in
# LightGBM artifact is a raw `Booster`, not an sklearn wrapper) - they belong
# to the offline pipeline scripts and the Streamlit dashboard, see the
# `pipeline` and `dashboard` extras below.
dependencies = [
    "duckdb>=1.0,<2.0",
    "pandas>=2.2,<3.0",
    "lightgbm>=4.3,<5.0",
    "scipy>=1.12",
    "statsmodels>=0.14",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
]

[project.optional-dependencies]
dashboard = [
    "streamlit>=1.32,<2.0",
    "plotly>=5.19,<6.0",
]
# Offline Hydra pipeline scripts (src/ingestion, src/processing, src/models/train_propensity.py,
# summarise/, scripts/) - never installed in the API container.
pipeline = [
    "hydra-core>=1.3,<2.0",
    "omegaconf>=2.3,<3.0",
    "polars>=1.0,<2.0",
    "pyarrow>=15.0",
    "scikit-learn>=1.4,<2.0",
]
api = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29",
    "slowapi>=0.1.9",
    "structlog>=24.1",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
    # CI supply-chain gates (Phase 1): dependency CVE audit + Python SAST.
    "pip-audit>=2.7",
    "bandit>=1.7",
    # pinned tightly: evidently's Report/Dataset/presets API has had breaking
    # changes across minor versions in the past.
    "evidently>=0.7,<0.8",
    "pandas-stubs",
    # test-only: reading the parquet quality-gate fixture and computing ROC-AUC
    "pyarrow>=15.0",
    "scikit-learn>=1.4,<2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*", "api*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks", "outputs", "interview"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
# E501: line length is handled by the formatter, not the linter.
# B008: FastAPI's `Depends(...)` default-argument pattern is the documented idiom,
# not the mutable-default-argument bug B008 targets.
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
packages = ["src", "api"]
strict = true
ignore_missing_imports = true
exclude = ["^src/(processing|ingestion)/.*legacy.*"]

[[tool.mypy.overrides]]
module = ["duckdb.*", "lightgbm.*", "hydra.*", "omegaconf.*", "streamlit.*", "plotly.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')"]
