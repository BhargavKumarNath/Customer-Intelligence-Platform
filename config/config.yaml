database:
  main_table: events
  memory_limit: 8GB
  read_only: false
paths:
  # ${hydra:runtime.cwd} is the directory the command was launched from (not
  # Hydra's per-run output dir, which it chdirs into by default). This keeps
  # these paths portable across machines/OSes instead of the previous
  # hardcoded `C:\Project\Customer Intelligence Platform\...` absolute paths,
  # which only ever resolved on the original Windows dev machine.
  database: ${hydra:runtime.cwd}/data/db/behavior.duckdb
  processed: ${hydra:runtime.cwd}/data/processed
  raw_data: ${hydra:runtime.cwd}/data/raw/ecommerce_optimized.parquet
